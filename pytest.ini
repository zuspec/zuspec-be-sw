[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
# ---------------------------------------------------------------------------
# KNOWN-FAILING, EXCLUDED SO THE OTHER 544 TESTS CAN GATE CI (2026-09-01).
#
# Baseline before excluding: 544 passed, 47 failed, 36 skipped, 82 errors.
# None of it is packaging fallout -- it predates the PyPI release work and was
# invisible because this repo had no CI until now. Two root causes account for
# essentially all of it, and both are real bugs to fix, not tests to delete.
#
# (1) AbstractionFieldIR has no `.datatype` -- 53 failures.
#     src/zuspec/be/sw/passes/elaborate.py:123 does
#         for field in dtype.fields:
#             field_dtype = self._resolve_type(field.datatype, ctxt)
#     i.e. it assumes every entry in dtype.fields is an ordinary field. It is
#     not: an abstraction field (IndexedRegFile, Counter, ...) elaborates to
#     zuspec.ir.core.AbstractionFieldIR, which is a deliberately OPAQUE node --
#     spec_type_name / field_name / field_index / py_cls / inst_kwargs /
#     ir_node, and no datatype. So any component containing an abstraction
#     field raises AttributeError during elaboration. The loop needs to
#     dispatch on the node kind instead of assuming one. This is a genuine gap
#     in be-sw's abstraction-field support, not IR drift: ir-core is doing what
#     it documents.
#
# (2) The `org.zuspec.example.*` fixture corpus is missing -- 72 errors.
#     test_rvcore_integration.py and friends do
#         from org.zuspec.example.mls.riscv.rv_units import ALUUnit
#     and no `org` package exists anywhere in this workspace, nor is one
#     declared by ivpm.yaml or pyproject.toml. The tests were written against
#     a corpus that never shipped with the repo.
#
# Plus 5 files needing zuspec.fe.pss, which is likewise not in this workspace.
#
# Excluded at file level because every one of these files is broken in whole
# or in large part; per-test deselection would run to ~129 entries and rot
# faster than it helps.
    --ignore=tests/unit/test_rvcore_integration.py
    --ignore=tests/unit/test_rvcore_units_integration.py
    --ignore=tests/unit/test_c_runtime_regfile.py
    --ignore=tests/unit/test_minicore_integration.py
    --ignore=tests/unit/test_backdoor_protocols.py
    --ignore=tests/unit/test_topology_b.py
    --ignore=tests/unit/test_pss_examples_e2e.py
    --ignore=tests/unit/test_pss_sv_example_e2e.py
    --ignore=tests/unit/passes/rtl/test_debug_layer.py

# Markers
markers =
    unit: Unit tests
    performance: Performance tests
    slow: Tests that take a long time to run
    integration: Integration tests
    benchmark_test: performance benchmark (requires --run-benchmarks)

# Minimum version
minversion = 6.0

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
